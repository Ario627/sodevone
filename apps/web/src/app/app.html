<header class="border-b border-garis-halus">
  <div
    class="mx-auto flex max-w-[76rem] flex-wrap items-center justify-between gap-x-5 px-5 py-1 sm:h-16 sm:flex-nowrap sm:px-8 sm:py-0"
  >
    <a
      class="bertanda min-h-11 shrink-0 items-center whitespace-nowrap font-serif text-[1.0625rem] leading-none tracking-[-0.015em]"
      routerLink="/"
    >
      {{ namaKelas() }}
    </a>

    <nav
      aria-label="Navigasi utama"
      class="scrollbar-none -mr-1 w-full overflow-x-auto overscroll-x-contain pb-1 sm:w-auto sm:pb-0"
    >
      <ul class="flex items-center gap-5 whitespace-nowrap sm:gap-6">
        @for (tautan of tautanNavigasi; track tautan.jalur) {
          <li>
            <a
              [routerLink]="tautan.jalur"
              routerLinkActive="text-teks-utama underline decoration-sinyal"
              [routerLinkActiveOptions]="{ exact: tautan.tepat }"
              ariaCurrentWhenActive="page"
              class="teks-meta inline-flex min-h-11 items-center text-teks-sekunder decoration-2 underline-offset-[7px] transition-colors duration-100 ease-keluar hover:text-teks-utama"
              >{{ tautan.label }}</a
            >
          </li>
        }
      </ul>
    </nav>
  </div>
</header>

<main
  id="konten-utama"
  class="mx-auto w-full max-w-[76rem] flex-1 px-5 pt-8 pb-16 sm:px-8 sm:pt-12"
  tabindex="-1"
>
  <router-outlet />
</main>

<footer class="mt-16 border-t border-garis-halus">
  <div
    class="mx-auto flex max-w-[76rem] flex-col gap-1 px-5 py-5 sm:flex-row sm:items-baseline sm:justify-between sm:px-8"
  >
    <p class="teks-meta text-teks-sekunder">{{ namaKelas() }} &middot; {{ tahun }}</p>
  </div>
</footer>
